<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ascend One-Time Offer</title>
    <script async src="https://cdn.superwall.me/runtime/entrypoint.js"></script>
    <link rel="stylesheet" href="/superwall/ascend-paywall.css" />
  </head>
  <body>
    <main class="paywall offer">
      <div class="offer-background" aria-hidden="true">
        <img src="/superwall/assets/auth-staircase-background.png" alt="" />
      </div>

      <section class="paywall-inner" aria-label="Ascend limited offer">
        <div class="wordmark" aria-label="Ascend">
          <img src="/superwall/assets/ascend-a-mark.png" alt="" />
          <span>SCEND</span>
        </div>

        <p class="eyebrow" data-pw-var="eyebrow">One-time offer</p>
        <h1 class="offer-title" data-pw-var="headline">Get <strong>50% Off</strong></h1>

        <p class="offer-detail" data-pw-var="offer_detail">
          Unlimited access for $24.99 / year
          <strong>Just $2.08/mo</strong>
        </p>

        <button class="cta" data-pw-purchase="primary" type="button" data-pw-var="cta">
          Claim Offer
        </button>

        <nav class="footer-links" aria-label="Subscription links">
          <button type="button" data-pw-restore>Restore</button>
          <span aria-hidden="true"></span>
          <a href="https://ascendstepper.com/terms" data-pw-open-url="https://ascendstepper.com/terms">Terms</a>
          <span aria-hidden="true"></span>
          <a href="https://ascendstepper.com/privacy" data-pw-open-url="https://ascendstepper.com/privacy">Privacy</a>
        </nav>
      </section>
    </main>
  </body>
</html>
