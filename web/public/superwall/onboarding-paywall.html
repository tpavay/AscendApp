<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
        color-scheme: dark;
      }
    </style>
    <title>Ascend Paywall</title>
    <script async src="https://cdn.superwall.me/runtime/entrypoint.js"></script>
    <link rel="stylesheet" href="/superwall/ascend-paywall.css" />
  </head>
  <body>
    <main class="paywall" data-selected-plan="yearly">
      <section class="paywall-inner" aria-label="Ascend subscription options">
        <div class="hero" aria-hidden="true">
          <img src="/superwall/assets/onboarding-stair-stepper.png" alt="" />
        </div>

        <div class="wordmark" aria-label="Ascend">
          <img src="/superwall/assets/ascend-a-mark.png" alt="" />
          <span>SCEND</span>
        </div>

        <h1 class="headline" data-plan-copy="yearly" data-pw-var="yearly_headline">Try 7 Days Free</h1>
        <h1 class="headline" data-plan-copy="monthly" data-pw-var="monthly_headline" hidden>Climb With Full Access</h1>

        <ul class="benefits" data-pw-skip-inner-html="true">
          <li data-pw-var="benefit_1" data-landmark-count-benefit>Choose from real landmarks to climb</li>
          <li data-pw-var="benefit_2">Compete on global leaderboards</li>
          <li data-pw-var="benefit_3">Track records and ascents</li>
        </ul>

        <div class="plans" data-pw-skip-inner-html="true">
          <button class="plan selected" type="button" data-plan="yearly" aria-pressed="true">
            <span class="trial-pill" data-pw-var="yearly_badge">BEST VALUE</span>
            <span class="plan-header">
              <span class="plan-name" data-pw-var="yearly_title">Yearly</span>
              <span class="plan-price" data-pw-var="yearly_price">$49.99/year</span>
            </span>
            <span class="plan-subtitle" data-pw-var="yearly_subtitle">$49.99/year, billed annually</span>
          </button>

          <button class="plan" type="button" data-plan="monthly" aria-pressed="false">
            <span class="plan-header">
              <span class="plan-name" data-pw-var="monthly_title">Monthly</span>
              <span class="plan-price" data-pw-var="monthly_price">$9.99/month</span>
            </span>
            <span class="plan-subtitle" data-pw-var="monthly_subtitle">Charged immediately, then monthly</span>
          </button>
        </div>

        <p class="purchase-disclosure" data-plan-copy="yearly" data-pw-var="yearly_disclosure">
          7 days free, then $49.99/year. Auto-renews until canceled.
        </p>
        <p class="purchase-disclosure" data-plan-copy="monthly" data-pw-var="monthly_disclosure" hidden>
          $9.99 charged now, then monthly. Auto-renews until canceled.
        </p>

        <button class="cta" data-plan-copy="yearly" data-pw-purchase="yearly" type="button" data-pw-var="yearly_cta">
          Try 7 Days Free
        </button>
        <button class="cta" data-plan-copy="monthly" data-pw-purchase="monthly" type="button" hidden data-pw-var="monthly_cta">
          Subscribe for $9.99/month
        </button>

        <nav class="footer-links" aria-label="Subscription links">
          <button type="button" data-pw-restore>Restore</button>
          <span aria-hidden="true"></span>
          <a href="https://ascendstepper.com/terms" data-pw-open-url="https://ascendstepper.com/terms">Terms</a>
          <span aria-hidden="true"></span>
          <a href="https://ascendstepper.com/privacy" data-pw-open-url="https://ascendstepper.com/privacy">Privacy</a>
        </nav>
      </section>
    </main>

    <script>
      const root = document.querySelector(".paywall");
      const plans = Array.from(document.querySelectorAll("[data-plan]"));
      const planCopy = Array.from(document.querySelectorAll("[data-plan-copy]"));

      function selectPlan(plan) {
        root.dataset.selectedPlan = plan;

        plans.forEach((button) => {
          const isSelected = button.dataset.plan === plan;
          button.classList.toggle("selected", isSelected);
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });

        planCopy.forEach((element) => {
          element.hidden = element.dataset.planCopy !== plan;
        });
      }

      plans.forEach((button) => {
        button.addEventListener("click", () => selectPlan(button.dataset.plan));
      });

      // The landmark count is a purchase-inducing promise, so it is read off the
      // published catalogue instead of typed in - the same manifest and catalogue
      // the app resolves its count from, so the two cannot promise different
      // numbers in one session. The manifest's catalogVersion is the cache key:
      // only a republished catalogue costs a second download. A fetch that fails
      // leaves the count-free copy standing rather than shipping a stale number.
      const LANDMARK_COUNT_CACHE_KEY = "ascend.raceableLandmarkCount";

      function readCachedLandmarkCount(catalogVersion) {
        try {
          const cached = JSON.parse(
            window.localStorage.getItem(LANDMARK_COUNT_CACHE_KEY) || "null"
          );
          if (cached && cached.catalogVersion === catalogVersion && cached.count > 0) {
            return cached.count;
          }
        } catch {
          // An unreadable cache just means fetching the catalogue.
        }

        return null;
      }

      function writeCachedLandmarkCount(catalogVersion, count) {
        try {
          window.localStorage.setItem(
            LANDMARK_COUNT_CACHE_KEY,
            JSON.stringify({catalogVersion, count})
          );
        } catch {
          // Storage being unavailable only costs the next impression a fetch.
        }
      }

      async function applyRaceableLandmarkCount() {
        const benefit = document.querySelector("[data-landmark-count-benefit]");
        if (!benefit) return;

        try {
          const manifestResponse = await fetch("/climbs/manifest.json", {cache: "no-store"});
          if (!manifestResponse.ok) return;

          const manifest = await manifestResponse.json();
          const cachedCount = readCachedLandmarkCount(manifest.catalogVersion);
          if (cachedCount) {
            benefit.textContent = `Choose from ${cachedCount} landmarks to climb`;
            return;
          }

          const catalogPath = manifest.catalogPath.startsWith("/")
            ? manifest.catalogPath
            : `/${manifest.catalogPath}`;

          const catalogResponse = await fetch(catalogPath);
          if (!catalogResponse.ok) return;

          const climbs = await catalogResponse.json();
          if (!Array.isArray(climbs)) return;

          const raceableCount = climbs.filter(
            (climb) => climb.releaseState === "available"
          ).length;
          if (raceableCount > 0) {
            benefit.textContent = `Choose from ${raceableCount} landmarks to climb`;
            writeCachedLandmarkCount(manifest.catalogVersion, raceableCount);
          }
        } catch {
          // Keep the count-free copy.
        }
      }

      applyRaceableLandmarkCount();
    </script>
  </body>
</html>
