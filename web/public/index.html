<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ascend – Stair Workout Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ascend is an iOS app for tracking StairMaster and stair-stepper workouts, with Ghost Mode pacing and optional Strava export." />
  <style>
    :root {
      --accent: #C79B43;
      --bg: #050608;
      --card: #101317;
      --text: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #171b23 0, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      max-width: 520px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(0,0,0,0.7);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.04em;
    }
    .tagline {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }
    p { margin: 8px 0; line-height: 1.5; }
    .meta {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Ascend</h1>
    <p class="tagline">StairMaster training, made measurable.</p>
    <p>
      Ascend is an iOS app focused on StairMaster and stair-stepper workouts.
      Log sessions, track pace with Ghost Mode, and optionally share completed
      workouts to your Strava profile as manual activities.
    </p>
    <p class="meta">
      Built by Tyler Pavay ·
      Contact: <a href="mailto:pavayt@gmail.com">pavayt@gmail.com</a>
    </p>
  </main>
</body>
</html>
