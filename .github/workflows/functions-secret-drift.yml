name: Functions Secret Drift

# A Functions secret version sits in Secret Manager doing nothing until the next
# Functions deploy binds it, whatever that deploy was for.
# REVENUECAT_SERVER_CONFIG version 3 sat there from 2026-09-08 to 2026-09-25,
# already missing rc_promo_app_access_lifetime, and the first anybody heard of it
# was comped climbers locked out of every paid screen after the 1.1 deploy.
#
# Both deploys now refuse a version functions/secret-versions.json does not pin,
# but a refusal in the middle of a release is the most expensive place to learn
# it. This runs the same read-only preflight against staging and production
# every day, so an unpinned version, or an allowlist that drops a product a live
# grant holds, turns red the day after it is created rather than on release day.
#
# Daily rather than weekly, unlike remote-config-drift.yml: this stays green
# unless something will block or break the next deploy, so a red run is never
# noise. A scheduled run reads the default branch, which is what the next merge
# to main carries.
#
# Strictly read-only. It reports and never repairs: the fix is a reviewed pin or
# a rebuilt secret version, never automation.
on:
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:

concurrency:
  group: functions-secret-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Report Functions Secret Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Both run even when the first fails, so one red run names every
      # environment that needs attention.
      - name: Check staging
        if: ${{ !cancelled() }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-functions-secrets.mjs preflight --project ascend-staging-fa7d5

      - name: Check production
        if: ${{ !cancelled() }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-functions-secrets.mjs preflight --project ascend-prod-9c8f2
