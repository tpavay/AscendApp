name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "AscendApp/**"
      - "AscendLiveActivityWidgets/**"
      - "AscendApp.xcodeproj/**"
      - "fastlane/**"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "functions/**"
      - "web/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".firebaserc"
      - ".github/workflows/deploy-staging.yml"

# Never cancel a staging deploy in flight. Every push to develop now triggers
# one, so back-to-back pushes would abort a run partway through the Firebase
# deploy or the TestFlight upload and leave staging half-deployed. Overlapping
# runs queue behind the running one instead.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (Staging)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set up Node.js for Sentry CLI
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Sentry CLI
        run: |
          npm install --global @sentry/cli@3.6.0
          sentry-cli --version

      - name: Configure SSH for match repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          rm -f AscendApp/App/Firebase/GoogleService-Info-Dev.plist
          rm -f AscendApp/App/Firebase/GoogleService-Info-Staging.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Staging.plist"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate build secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MATCH_GIT_URL" ]; then
            echo "::error::Required secret MATCH_GIT_URL is missing or empty."
            exit 1
          fi

          if [ -z "$MATCH_PASSWORD" ]; then
            echo "::error::Required secret MATCH_PASSWORD is missing or empty."
            exit 1
          fi

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Required secret SENTRY_AUTH_TOKEN is missing or empty."
            exit 1
          fi

      # A placeholder RevenueCat or Superwall key would archive and upload
      # cleanly while leaving every staging tester behind an unresolvable
      # paywall, so fail before the archive instead.
      - name: Verify staging monetization keys
        shell: bash
        run: node scripts/ci/assert-monetization-keys-configured.mjs Staging

      # The kill switches are the only undo a shipped binary has, and a build
      # whose parameters were never published to the backend behaves completely
      # normally until the moment someone needs the lever. CI previously compared
      # the checked-in template to the Swift enum and never to the live project,
      # which is how #318 stayed invisible. Compare against the backend.
      - name: Verify staging kill switches are published
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: node scripts/ci/assert-remote-config-published.mjs staging

      - name: Derive build number
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(scripts/ci/derive-build-number.sh 0)"
          echo "BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"

      - name: Build staging IPA via Fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: main
          MATCH_READONLY: "true"
          IOS_SIGNING_IDENTITY: Apple Distribution
          IOS_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.staging
          IOS_DEVELOPMENT_TEAM: QWGVB7TN4T
          IOS_STAGING_BUNDLE_ID: com.TylerPavay.AscendApp.staging
          IOS_STAGING_WIDGET_BUNDLE_ID: com.TylerPavay.AscendApp.staging.LiveClimbWidgets
          IOS_STAGING_WIDGET_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.staging.LiveClimbWidgets
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: bundle exec fastlane build_staging

      - name: Upload staging IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: fastlane/build/AscendApp-Staging.ipa
          retention-days: 14

  # Runs in parallel with the IPA build: the Firebase deploy has no dependency
  # on the iOS binary, and staging tolerates backend deploying even when the
  # app build fails. Production stays strictly sequential (stop on failure).
  deploy-firebase:
    name: Deploy Firebase (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies for deploy
        run: |
          npm --prefix functions ci
          npm --prefix web ci

      - name: Build web app
        run: npm --prefix web run build

      - name: Deploy Functions, Rules, Indexes, Storage, and Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only functions,firestore:rules,firestore:indexes,storage,hosting --non-interactive --force --token "$FIREBASE_TOKEN"

      # Staging is where a functions drift should be caught, not production.
      # The reconciliation is against the checked-out ref, so this asserts that
      # ascend-staging-fa7d5 holds exactly what `develop` exports.
      - name: Verify deployed functions match this ref
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-deployed-functions.mjs --project ascend-staging-fa7d5

  upload-testflight:
    name: Upload to TestFlight (Staging)
    needs:
      - build-ios
      - deploy-firebase
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Download staging IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: build

      - name: Upload artifact to TestFlight
        env:
          IPA_PATH: build/AscendApp-Staging.ipa
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane upload_testflight
