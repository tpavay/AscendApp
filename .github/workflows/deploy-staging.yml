name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "AscendApp/**"
      - "AscendApp.xcodeproj/**"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "functions/**"
      - "web/**"
      - "firebase.json"
      - "firestore.rules"
      - ".firebaserc"
      - ".github/workflows/deploy-staging.yml"

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (Staging)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Staging.plist"

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi
          }

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          decode_base64_required "BUILD_CERTIFICATE_BASE64" "$BUILD_CERTIFICATE_BASE64" "$CERTIFICATE_PATH"
          decode_base64_required "BUILD_PROVISION_PROFILE_BASE64" "$BUILD_PROVISION_PROFILE_BASE64" "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::No Apple Distribution identity with private key found in BUILD_CERTIFICATE_BASE64."
            echo "Re-export the certificate from Keychain Access as a .p12 including the private key."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Build staging IPA via Fastlane
        env:
          IOS_SIGNING_IDENTITY: Apple Distribution
          IOS_PROVISIONING_PROFILE_SPECIFIER: AscendApp - Staging - AppStore
          IOS_DEVELOPMENT_TEAM: QWGVB7TN4T
          IOS_STAGING_BUNDLE_ID: com.TylerPavay.AscendApp.staging
        run: bundle exec fastlane build_staging

      - name: Upload staging IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: build/AscendApp-Staging.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  deploy-firebase:
    name: Deploy Firebase (Staging)
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies for deploy
        run: |
          npm install --global firebase-tools
          npm --prefix functions ci
          npm --prefix web ci

      - name: Build web app
        run: npm --prefix web run build

      - name: Deploy Functions, Rules, and Hosting
        run: firebase deploy --project ascend-staging-fa7d5 --only functions,firestore:rules,hosting --non-interactive

  upload-testflight:
    name: Upload to TestFlight (Staging)
    needs:
      - build-ios
      - deploy-firebase
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Download staging IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: build

      - name: Upload artifact to TestFlight
        env:
          IPA_PATH: build/AscendApp-Staging.ipa
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane upload_testflight
