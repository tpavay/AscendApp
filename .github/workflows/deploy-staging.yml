name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "AscendApp/**"
      - "AscendLiveActivityWidgets/**"
      # The retained watch target remains a build dependency for the 1.1
      # release, so a watch-only change can still affect this archive.
      - "AscendWatch/**"
      - "AscendWatchShared/**"
      - "AscendApp.xcodeproj/**"
      - "fastlane/**"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "functions/**"
      - "web/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".firebaserc"
      # The file that declares the kill switches is the file that must trigger the
      # job that publishes them. It would fire today by way of the AscendApp/**
      # match, since the parity check forces RemoteFeatureFlag.swift to move with
      # it - but that is a coincidence of another check, not a guarantee.
      - "remoteconfig.template.json"
      - ".github/workflows/deploy-staging.yml"

# Never cancel a staging deploy in flight. Every push to develop now triggers
# one, so back-to-back pushes would abort a run partway through the Firebase
# deploy or the TestFlight upload and leave staging half-deployed. Overlapping
# runs queue behind the running one instead.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_STORE_CONNECT_APP_ID: "6759919365"
  APP_STORE_CONNECT_BUNDLE_ID: com.TylerPavay.AscendApp.staging

jobs:
  # Its own job, and `build-ios` waits on it, because the obvious home for this -
  # a step in `deploy-firebase` beside the rules and indexes - does not actually
  # run first. `deploy-firebase` runs in PARALLEL with `build-ios` here, so a
  # publish there would race the archive preflight that reads the same backend;
  # and in `deploy-production.yml` `deploy-firebase` NEEDS `build-ios`, so a
  # publish there would land strictly after the archive it was meant to satisfy.
  # A dedicated job ahead of the archive is the only ordering that holds, and it
  # costs the staging build about a minute.
  #
  # What it publishes is only ever a parameter the project has never held. It
  # cannot change or re-enable an existing switch, and it refuses to write at all
  # while any switch is off - see scripts/publish-new-kill-switches.mjs.
  # Production is deliberately absent: it stays a captain-only manual publish,
  # per docs/production-backend-rollout-runbook.md.
  publish-kill-switches:
    name: Publish New Kill Switches (Dev + Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Dev is the developer sandbox and nothing archives against it, so a dev-only
      # failure must not hold the staging release train. It still shows red in the
      # run, and remote-config-drift.yml is the backstop that keeps dev honest.
      - name: Publish new kill switches to dev
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/publish-new-kill-switches.mjs dev --apply

      - name: Publish new kill switches to staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/publish-new-kill-switches.mjs staging --apply

  build-ios:
    name: Build iOS IPA (Staging)
    needs: publish-kill-switches
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      build-number: ${{ steps.verify-embedded-build-number.outputs.build_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set up Node.js for Sentry CLI
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Sentry CLI
        run: |
          npm install --global @sentry/cli@3.6.0
          sentry-cli --version

      - name: Configure SSH for match repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          rm -f AscendApp/App/Firebase/GoogleService-Info-Dev.plist
          rm -f AscendApp/App/Firebase/GoogleService-Info-Staging.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Staging.plist"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate build secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MATCH_GIT_URL" ]; then
            echo "::error::Required secret MATCH_GIT_URL is missing or empty."
            exit 1
          fi

          if [ -z "$MATCH_PASSWORD" ]; then
            echo "::error::Required secret MATCH_PASSWORD is missing or empty."
            exit 1
          fi

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Required secret SENTRY_AUTH_TOKEN is missing or empty."
            exit 1
          fi

      - name: Verify Mixpanel build destinations
        run: node scripts/ci/assert-mixpanel-build-settings.mjs

      # A placeholder RevenueCat or Superwall key would archive and upload
      # cleanly while leaving every staging tester behind an unresolvable
      # paywall, so fail before the archive instead.
      - name: Verify staging monetization keys
        shell: bash
        run: node scripts/ci/assert-monetization-keys-configured.mjs Staging

      # The kill switches are the only undo a shipped binary has, and a build
      # whose parameters were never published to the backend behaves completely
      # normally until the moment someone needs the lever. CI previously compared
      # the checked-in template to the Swift enum and never to the live project,
      # which is how #318 stayed invisible. Compare against the backend.
      #
      # `publish-kill-switches` has already added anything this ref introduces, so
      # a failure here now means the automation deliberately declined to write -
      # a switch is off, or the live template is a shape it will not guess at.
      - name: Verify staging kill switches are published
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: node scripts/ci/assert-remote-config-published.mjs staging

      - name: Derive build number
        id: derive-build-number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(scripts/ci/derive-build-number.sh "$APP_STORE_CONNECT_APP_ID" "$APP_STORE_CONNECT_BUNDLE_ID")"
          if [ -z "$build_number" ]; then
            echo "::error::Build number derivation exited successfully but produced no value."
            exit 1
          fi
          echo "BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

      - name: Provision watchOS runtime (best effort)
        shell: bash
        run: ./scripts/ci/ensure-watchos-runtime.sh

      - name: Build staging IPA via Fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: main
          MATCH_READONLY: "true"
          IOS_SIGNING_IDENTITY: Apple Distribution
          IOS_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.staging
          IOS_DEVELOPMENT_TEAM: QWGVB7TN4T
          IOS_STAGING_BUNDLE_ID: com.TylerPavay.AscendApp.staging
          IOS_STAGING_WIDGET_BUNDLE_ID: com.TylerPavay.AscendApp.staging.LiveClimbWidgets
          IOS_STAGING_WIDGET_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.staging.LiveClimbWidgets
          IOS_STAGING_WATCH_BUNDLE_ID: com.TylerPavay.AscendApp.staging.watch
          IOS_STAGING_WATCH_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.staging.watch
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: bundle exec fastlane build_staging

      # Publish the number read back from the actual signed artifact, after
      # proving it matches the allocator. The upload job therefore receives the
      # build number the IPA contains, not a separately recomputed value.
      - name: Verify embedded build number
        id: verify-embedded-build-number
        env:
          IPA_PATH: fastlane/build/AscendApp-Staging.ipa
        shell: bash
        run: |
          set -euo pipefail
          verified_build_number="$(scripts/ci/verify-ipa-build-number.sh "$IPA_PATH" "$BUILD_NUMBER")"
          printf 'build_number=%s\n' "$verified_build_number" >> "$GITHUB_OUTPUT"

      - name: Verify staging Mixpanel destination in the IPA
        run: node scripts/ci/assert-mixpanel-bundle.mjs Staging fastlane/build/AscendApp-Staging.ipa

      # The IPA is the artifact Apple's upload validation rejects, and it is the
      # only place the staging phone icon set is resolved at all.
      - name: Verify app icons in the IPA
        run: node scripts/ci/assert-app-icon-present.mjs fastlane/build/AscendApp-Staging.ipa

      - name: Upload staging IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: fastlane/build/AscendApp-Staging.ipa
          retention-days: 14

  # Runs in parallel with the IPA build: the Firebase deploy has no dependency
  # on the iOS binary, and staging tolerates backend deploying even when the
  # app build fails. Production stays strictly sequential (stop on failure).
  deploy-firebase:
    name: Deploy Firebase (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies for deploy
        run: |
          npm --prefix functions ci
          npm --prefix web ci

      - name: Build web app
        run: npm --prefix web run build

      # The entitlement functions and their expiry index must exist before the
      # paid rules can close access. A missing RevenueCat secret now stops this
      # job before rules deploy instead of shipping a backend-wide lockout.
      - name: Deploy Firestore indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only firestore:indexes --non-interactive --token "$FIREBASE_TOKEN"

      - name: Wait for every declared Firestore index
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIRESTORE_INDEX_STRUCTURAL_GRACE_MS: ${{ vars.FIRESTORE_INDEX_STRUCTURAL_GRACE_MS }}
        shell: bash
        run: |
          set -euo pipefail

          firebase_bin="$(npm exec --yes --package=firebase-tools@15.22.1 -- which firebase)"
          firebase_tools_root="$(cd "$(dirname "$firebase_bin")/../firebase-tools" && pwd -P)"
          FIREBASE_TOOLS_ROOT="$firebase_tools_root" \
            node scripts/ci/wait-for-firestore-indexes.mjs \
              firestore.indexes.json \
              ascend-staging-fa7d5 \
              "(default)"

      - name: Deploy Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only functions --non-interactive --force --token "$FIREBASE_TOKEN"

      # Staging is where a functions drift should be caught, not production.
      # The reconciliation is against the checked-out ref, so this asserts that
      # ascend-staging-fa7d5 holds exactly what `develop` exports.
      - name: Verify deployed functions match this ref
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-deployed-functions.mjs --project ascend-staging-fa7d5

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only firestore:rules --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only storage --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project ascend-staging-fa7d5 --only hosting --non-interactive --token "$FIREBASE_TOKEN"

  upload-testflight:
    name: Upload to TestFlight (Staging)
    needs:
      - build-ios
      - deploy-firebase
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download staging IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: AscendApp-Staging-IPA
          path: build

      - name: Verify TestFlight build-number handoff
        env:
          IPA_PATH: build/AscendApp-Staging.ipa
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
        shell: bash
        run: scripts/ci/verify-ipa-build-number.sh "$IPA_PATH" "$BUILD_NUMBER"

      - name: Upload artifact to TestFlight
        env:
          IPA_PATH: build/AscendApp-Staging.ipa
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane upload_testflight

      # This job is the last one in the group, so it is what holds `deploy-staging`.
      # The allocator reads active build-upload records as well as processed
      # builds. Confirm this exact upload is recorded before releasing the group,
      # without blocking on Apple's separate build-processing index.
      - name: Confirm App Store Connect recorded the build upload
        env:
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/await-build-upload-recorded.mjs "$APP_STORE_CONNECT_APP_ID" "$APP_STORE_CONNECT_BUNDLE_ID" "$BUILD_NUMBER"
