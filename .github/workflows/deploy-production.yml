name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AscendApp/**"
      - "AscendLiveActivityWidgets/**"
      # The watch app ships inside the iOS app bundle, so a watch-only
      # change has to trigger the build that carries it.
      - "AscendWatch/**"
      - "AscendWatchShared/**"
      - "AscendApp.xcodeproj/**"
      - "fastlane/**"
      - "scripts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "functions/**"
      - "web/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".firebaserc"
      - ".github/workflows/deploy-production.yml"

# A production deploy must never be aborted part-way, so an in-flight run is
# never cancelled. The cost of that choice is that a run which stops moving
# holds this group indefinitely, and GitHub keeps at most ONE pending run per
# group - each new run cancels the one it displaces, before that run has
# created a single job. Between 2026-07-16 and 2026-07-29 that cancelled six
# runs in silence. `deploy-production-watchdog.yml` is what makes it audible;
# the single approval gate below is what stops it recurring.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_STORE_CONNECT_APP_ID: "6757202987"
  APP_STORE_CONNECT_BUNDLE_ID: com.TylerPavay.AscendApp

jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check production readiness
        id: readiness
        run: |
          if [ "${{ vars.PRODUCTION_READY }}" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production deploy is disabled."
            echo "Set repository variable PRODUCTION_READY=true after provisioning production Firebase + secrets."
            echo "Workflow will fail before deploy jobs."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Production deploy is enabled."
          fi

  # The ONLY job that carries `environment: production`, and it does nothing
  # else. Every protected job opens its own deployment that starts in `waiting`
  # for the environment's required reviewer, so spreading the environment over
  # three jobs asked for three separate approvals. On run 29540507247 the third
  # request (deployment 5481609169) appeared three minutes after the Firebase
  # deploy had already reported success, was never noticed, and sat `waiting`
  # for 12 days 18 hours - keeping the run open and the concurrency group held.
  # One approval, requested before any work starts, or none at all.
  production-approval:
    name: Approve Production Deploy
    if: ${{ needs.production-gate.outputs.ready == 'true' }}
    needs: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Record approval
        run: echo "Production deploy approved for ${{ github.sha }}."

  build-ios:
    name: Build iOS IPA (Production)
    if: ${{ needs.production-gate.outputs.ready == 'true' }}
    needs:
      - production-gate
      - production-approval
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      build-number: ${{ steps.verify-embedded-build-number.outputs.build_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set up Node.js for Sentry CLI
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Sentry CLI
        run: |
          npm install --global @sentry/cli@3.6.0
          sentry-cli --version

      - name: Configure SSH for match repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Decode production Firebase plist
        env:
          GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          rm -f AscendApp/App/Firebase/GoogleService-Info-Production.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Production.plist"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate build secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MATCH_GIT_URL" ]; then
            echo "::error::Required secret MATCH_GIT_URL is missing or empty."
            exit 1
          fi

          if [ -z "$MATCH_PASSWORD" ]; then
            echo "::error::Required secret MATCH_PASSWORD is missing or empty."
            exit 1
          fi

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Required secret SENTRY_AUTH_TOKEN is missing or empty."
            exit 1
          fi

      - name: Verify Mixpanel build destinations
        run: node scripts/ci/assert-mixpanel-build-settings.mjs

      # A placeholder RevenueCat or Superwall key would archive and upload
      # cleanly while locking every App Store user behind an unresolvable
      # paywall, so fail before the archive instead.
      - name: Verify production monetization keys
        shell: bash
        run: node scripts/ci/assert-monetization-keys-configured.mjs Release

      # An App Store binary cannot be rolled back, so these switches are the only
      # thing that can stop a shipped data-corrupting write. A build whose
      # parameters were never published to the backend carries no such lever, and
      # looks identical to one that does. Refuse to archive it.
      - name: Verify production kill switches are published
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: node scripts/ci/assert-remote-config-published.mjs prod

      - name: Derive build number
        id: derive-build-number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(scripts/ci/derive-build-number.sh "$APP_STORE_CONNECT_APP_ID" "$APP_STORE_CONNECT_BUNDLE_ID")"
          if [ -z "$build_number" ]; then
            echo "::error::Build number derivation exited successfully but produced no value."
            exit 1
          fi
          echo "BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

      - name: Ensure watchOS runtime
        shell: bash
        run: ./scripts/ci/ensure-watchos-runtime.sh

      - name: Build production IPA via Fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: main
          MATCH_READONLY: "true"
          IOS_SIGNING_IDENTITY: Apple Distribution
          IOS_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp
          IOS_DEVELOPMENT_TEAM: QWGVB7TN4T
          IOS_PRODUCTION_BUNDLE_ID: com.TylerPavay.AscendApp
          IOS_PRODUCTION_WIDGET_BUNDLE_ID: com.TylerPavay.AscendApp.LiveClimbWidgets
          IOS_PRODUCTION_WIDGET_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.LiveClimbWidgets
          IOS_PRODUCTION_WATCH_BUNDLE_ID: com.TylerPavay.AscendApp.watch
          IOS_PRODUCTION_WATCH_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.TylerPavay.AscendApp.watch
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: bundle exec fastlane build_production

      # Publish the number read back from the actual signed artifact, after
      # proving it matches the allocator. The upload job therefore receives the
      # build number the IPA contains, not a separately recomputed value.
      - name: Verify embedded build number
        id: verify-embedded-build-number
        env:
          IPA_PATH: fastlane/build/AscendApp-Production.ipa
        shell: bash
        run: |
          set -euo pipefail
          verified_build_number="$(scripts/ci/verify-ipa-build-number.sh "$IPA_PATH" "$BUILD_NUMBER")"
          printf 'build_number=%s\n' "$verified_build_number" >> "$GITHUB_OUTPUT"

      - name: Verify production Mixpanel destination in the IPA
        run: node scripts/ci/assert-mixpanel-bundle.mjs Release fastlane/build/AscendApp-Production.ipa

      - name: Upload production IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscendApp-Production-IPA
          path: fastlane/build/AscendApp-Production.ipa
          retention-days: 14

  deploy-firebase:
    name: Deploy Firebase (Production)
    if: ${{ needs.production-gate.outputs.ready == 'true' }}
    needs:
      - production-gate
      - production-approval
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies for deploy
        run: |
          npm --prefix functions ci
          npm --prefix web ci

      - name: Build web app
        run: npm --prefix web run build

      # Indexes go first because onWorkoutWritten immediately queries workouts
      # by source + climbId. Functions go before Hosting because both Hosting
      # rewrites target functions deployed by this job. The binary uploads only
      # after this entire job succeeds, so its backend is already compatible.
      - name: Deploy Firestore indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only firestore:indexes --non-interactive --token "$FIREBASE_TOKEN"

      - name: Wait for every declared Firestore index
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Unset leaves the 2-minute default; set the repository variable to
          # raise it during an incident without shipping code.
          FIRESTORE_INDEX_STRUCTURAL_GRACE_MS: ${{ vars.FIRESTORE_INDEX_STRUCTURAL_GRACE_MS }}
        shell: bash
        run: |
          set -euo pipefail

          firebase_bin="$(npm exec --yes --package=firebase-tools@15.22.1 -- which firebase)"
          firebase_tools_root="$(cd "$(dirname "$firebase_bin")/../firebase-tools" && pwd -P)"
          FIREBASE_TOOLS_ROOT="$firebase_tools_root" \
            node scripts/ci/wait-for-firestore-indexes.mjs \
              firestore.indexes.json \
              "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" \
              "(default)"

      - name: Deploy Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only functions --non-interactive --force --token "$FIREBASE_TOKEN"

      - name: Verify critical Functions are active
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          npx -y firebase-tools@15.22.1 --json functions:list --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --token "$FIREBASE_TOKEN" \
            | node scripts/ci/assert-firebase-functions-active.mjs \
                cleanupDeletedUserData \
                expireRevenueCatEntitlements \
                onPublicIdentityPropagationJobWritten \
                onPublicProfileIdentityWritten \
                onWorkoutWritten \
                onWorkoutReplaySplitsWritten \
                processRevenueCatAnalyticsOutbox \
                reconcileAppAccess \
                revenueCatWebhook \
                unsubscribeFromEmails

      # The step above proves a curated set of critical functions is healthy.
      # This one proves the project holds *exactly* what this ref exports - the
      # property that was missing when production spent two weeks without
      # cleanupDeletedUserData, onWorkoutWritten and unsubscribeFromEmails
      # behind a green deploy log. A curated list cannot catch a function nobody
      # thought to add to it, and cannot catch one deleted from source but still
      # serving traffic.
      - name: Verify deployed functions match this ref
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-deployed-functions.mjs --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}"

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only firestore:rules --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only storage --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project "${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}" --only hosting --non-interactive --token "$FIREBASE_TOKEN"

      - name: Verify Hosting serves the climb manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "https://${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}.web.app/climbs/manifest.json" \
            --output /dev/null

  upload-testflight:
    name: Upload to TestFlight (Production)
    if: ${{ needs.production-gate.outputs.ready == 'true' }}
    needs:
      - production-gate
      - production-approval
      - build-ios
      - deploy-firebase
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download production IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: AscendApp-Production-IPA
          path: build

      - name: Verify TestFlight build-number handoff
        env:
          IPA_PATH: build/AscendApp-Production.ipa
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
        shell: bash
        run: scripts/ci/verify-ipa-build-number.sh "$IPA_PATH" "$BUILD_NUMBER"

      - name: Upload artifact to TestFlight
        env:
          IPA_PATH: build/AscendApp-Production.ipa
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane upload_testflight

      # `deploy-status` runs after this job but holds no App Store Connect
      # dependency, so this is the last point that can keep the per-app sequence
      # serialized. Confirm the active upload record exists; final processing is
      # not required because the allocator also reads the upload ledger.
      - name: Confirm App Store Connect recorded the build upload
        env:
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/await-build-upload-recorded.mjs "$APP_STORE_CONNECT_APP_ID" "$APP_STORE_CONNECT_BUNDLE_ID" "$BUILD_NUMBER"

  # A production deploy either succeeds or fails. This job is what makes a run
  # that quietly deployed *nothing* conclude `failure` instead of `success` -
  # most importantly a stage reporting `skipped` because an upstream job was
  # skipped, which GitHub would otherwise roll up into a green run. That case
  # does send the failure email.
  #
  # What it does NOT do is rescue a cancelled run. Measured on throwaway run
  # 30676439255: the run was cancelled mid-flight, the `always()` status job
  # ran and concluded `failure`, and the RUN still concluded `cancelled` -
  # GitHub's run-conclusion precedence puts cancellation above a failed job, so
  # no email fires. Cancellation is carried entirely by
  # `deploy-production-watchdog.yml`, which observes the run from outside.
  #
  # `always()` still earns its place: it is what lets this job run at all when
  # an upstream job was skipped or failed.
  deploy-status:
    name: Deploy Status
    if: ${{ always() }}
    needs:
      - production-gate
      - production-approval
      - build-ios
      - deploy-firebase
      - upload-testflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert the run reached a real outcome
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          bash scripts/ci/assert-deploy-outcome.sh \
            "${{ needs.production-gate.result }}" \
            "${{ needs.production-gate.outputs.ready }}" \
            "production-approval=${{ needs.production-approval.result }}" \
            "build-ios=${{ needs.build-ios.result }}" \
            "deploy-firebase=${{ needs.deploy-firebase.result }}" \
            "upload-testflight=${{ needs.upload-testflight.result }}"
