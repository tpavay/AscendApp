name: CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      # required-check-paths:start
      - "AscendApp/**"
      - "AscendAppTests/**"
      - "AscendLiveActivityWidgets/**"
      - "AscendApp.xcodeproj/**"
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - "tests/firebase-rules/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - "fastlane/**"
      - "SharedTestVectors/**"
      - "docs/superwall-paywall-setup.md"
      - "docs/onboarding-design-guide.md"
      - "docs/app-store-brief.md"
      - "docs/launch-readiness-audit.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/workflows/**"
      # required-check-paths:end

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      functions: ${{ steps.filter.outputs.functions }}
      scripts: ${{ steps.filter.outputs.scripts }}
      web: ${{ steps.filter.outputs.web }}
      root_npm: ${{ steps.filter.outputs.root_npm }}
      firebase: ${{ steps.filter.outputs.firebase }}
      ruby: ${{ steps.filter.outputs.ruby }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - "AscendApp/**"
              - "AscendAppTests/**"
              - "AscendLiveActivityWidgets/**"
              - "AscendApp.xcodeproj/**"
              # The Swift halves of the shared cross-language vectors assert
              # against these files directly, so a vector-only edit must run them.
              - "SharedTestVectors/**"
              - ".github/workflows/**"
            functions:
              - "functions/**"
              - "firestore.indexes.json"
              - "SharedTestVectors/**"
              - ".github/workflows/**"
            scripts:
              - "scripts/**"
              - "SharedTestVectors/**"
              # The monetization build-configuration suite reads all three, so a
              # key, Info.plist, or placeholder-contract edit must run it.
              - "AscendApp.xcodeproj/**"
              - "AscendApp/Info.plist"
              - "AscendApp/Features/Monetization/**"
              # The Firebase configuration suite validates all three directly.
              - "firebase.json"
              - ".firebaserc"
              - "firestore.indexes.json"
              # The launch-offer suite reads the hosted paywall, public copy,
              # legal terms, and authoritative commerce guidance.
              - "web/public/superwall/**"
              - "web/src/pages/index.astro"
              - "web/src/pages/terms.astro"
              - "docs/superwall-paywall-setup.md"
              - "docs/onboarding-design-guide.md"
              - "docs/app-store-brief.md"
              - "docs/launch-readiness-audit.md"
              # AGENTS.md is a symlink to CLAUDE.md, so it gates identically.
              - "CLAUDE.md"
              - "AGENTS.md"
              - ".github/workflows/**"
            web:
              - "web/**"
              - ".github/workflows/**"
            root_npm:
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/**"
            firebase:
              - "firestore.rules"
              - "storage.rules"
              - "firestore.indexes.json"
              - "firebase.json"
              - ".firebaserc"
              - "tests/firebase-rules/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/**"
            ruby:
              - "Gemfile"
              - "Gemfile.lock"
              - ".ruby-version"
              - "fastlane/**"
              - ".github/workflows/**"

  functions-verify:
    name: Functions Verify
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm --prefix functions ci

      - name: Lint
        run: npm --prefix functions run lint

      - name: Run tests
        run: npm --prefix functions test

      # Audits run last so a newly published advisory fails the job without
      # hiding the lint and test results that prove the code itself.
      - name: Audit dependencies
        run: npm --prefix functions audit --audit-level=low

  scripts-verify:
    name: Scripts Verify
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # The public-identity contract suite spawns dev-db.mjs itself to prove the
      # hydrate-user argument and identity checks run before Firebase is touched,
      # so the scripts package - firebase-admin included - has to be installed.
      - name: Install dependencies
        run: npm --prefix scripts ci

      # sentry-cli is required, not optional: the dSYM upload suite asserts the
      # flags the release script passes against this exact pinned CLI's help.
      # Keep this version identical to the deploy workflows.
      - name: Install Sentry CLI
        run: npm install --global @sentry/cli@3.6.0

      - name: Run tests
        run: node --test scripts/test/*.test.mjs

      # Audits run last so a newly published advisory fails the job without
      # hiding the test results that prove the code itself.
      - name: Audit dependencies
        run: npm --prefix scripts audit --package-lock-only --audit-level=low

  web-verify:
    name: Web Verify
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Build website
        run: npm --prefix web run build

      - name: Audit dependencies
        run: npm --prefix web audit --audit-level=low

  root-npm-verify:
    name: Root npm Audit
    needs: changes
    if: needs.changes.outputs.root_npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low

  firebase-verify:
    name: Firebase Verify
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The Firestore and Storage emulators are JVM processes, and the pinned
      # firebase-tools refuses to start them on a JDK older than 21. The runner
      # image's default JDK is older than that, so pin one the CLI accepts.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Firebase configuration
        run: node scripts/ci/validate-firebase-config.mjs

      # The emulators load firestore.rules and storage.rules before executing
      # the suite, so invalid syntax fails the job before any unit test runs.
      - name: Validate rules and run emulator tests
        run: npm run test:firebase-rules

  # Verifies the bundle under the Ruby the deploy workflows pin, not the local
  # .ruby-version, so the gate resolves the Gemfile the way releases do.
  ruby-verify:
    name: Ruby and Fastlane Verify
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies in deployment mode
        run: bundle install --deployment --jobs 4 --retry 3

      - name: Validate Fastlane lanes
        run: bundle exec fastlane lanes

  ios-verify:
    name: iOS Verify (Staging)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          rm -f AscendApp/App/Firebase/GoogleService-Info-Dev.plist
          rm -f AscendApp/App/Firebase/GoogleService-Info-Staging.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Staging.plist"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The runner image decides which simulator runtimes and devices it ships,
      # and that set changes without notice - treating it as the source of truth
      # makes every PR fail the day it changes. Provision the device this job
      # needs instead, falling back through: reuse a preferred model, reuse any
      # iPhone, then create one.
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          preferred_names=(
            "iPhone 17 Pro"
            "iPhone 17"
            "iPhone 16 Pro"
            "iPhone 16"
            "iPhone 15 Pro"
            "iPhone 15"
          )

          newest_ios_runtime() {
            xcrun simctl list runtimes -j | jq -r '
              [.runtimes[]
                | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))]
              | sort_by(.version | split(".") | map(tonumber))
              | last | .identifier // empty
            '
          }

          runtime="$(newest_ios_runtime)"

          # Xcode bundles the simulator SDK but not the runtime, so an image can
          # compile for the simulator while offering nothing to run tests on.
          # A failed download still falls through to the diagnostics below.
          if [ -z "$runtime" ]; then
            echo "No iOS simulator runtime installed; downloading the one Xcode expects."
            xcodebuild -downloadPlatform iOS || echo "::warning::Downloading the iOS simulator runtime failed."
            runtime="$(newest_ios_runtime)"
          fi

          if [ -z "$runtime" ]; then
            echo "::error::No iOS simulator runtime is available."
            xcrun simctl list runtimes
            exit 1
          fi

          device_named() {
            xcrun simctl list devices -j | jq -r --arg rt "$runtime" --arg name "$1" '
              .devices[$rt] // []
              | map(select(.isAvailable and .name == $name))
              | last | .udid // empty
            '
          }

          simulator_id=""

          for name in "${preferred_names[@]}"; do
            simulator_id="$(device_named "$name")"

            if [ -n "$simulator_id" ]; then
              break
            fi
          done

          if [ -z "$simulator_id" ]; then
            simulator_id="$(
              xcrun simctl list devices -j | jq -r --arg rt "$runtime" '
                .devices[$rt] // []
                | map(select(.isAvailable and ((.deviceTypeIdentifier // "") | test("SimDeviceType.iPhone"))))
                | last | .udid // empty
              '
            )"
          fi

          if [ -z "$simulator_id" ]; then
            device_type=""

            for name in "${preferred_names[@]}"; do
              device_type="$(
                xcrun simctl list runtimes -j | jq -r --arg rt "$runtime" --arg name "$name" '
                  .runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes
                  | map(select(.name == $name))
                  | last | .identifier // empty
                '
              )"

              if [ -n "$device_type" ]; then
                break
              fi
            done

            if [ -z "$device_type" ]; then
              device_type="$(
                xcrun simctl list runtimes -j | jq -r --arg rt "$runtime" '
                  .runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes
                  | map(select(.productFamily == "iPhone"))
                  | last | .identifier // empty
                '
              )"
            fi

            if [ -z "$device_type" ]; then
              echo "::error::Runtime ${runtime} supports no iPhone device type."
              xcrun simctl list devicetypes
              exit 1
            fi

            echo "No iPhone simulator on ${runtime}; creating one from ${device_type}."
            simulator_id="$(xcrun simctl create "ci-iphone" "$device_type" "$runtime")"
          fi

          echo "Selected simulator ${simulator_id} on ${runtime}."
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      # The device (iphoneos) compile is covered by the ios-verify-release job;
      # this job proves the simulator build + test suite, so the app compiles
      # exactly once per job instead of twice.
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild \
            -project AscendApp.xcodeproj \
            -scheme "AscendApp-Staging" \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath build-logs/AscendApp-Staging.xcresult \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee build-logs/xcodebuild-staging.log

      # A step killed by timeout-minutes reports `cancelled`, not `failure`, and
      # that is exactly the hung-runner case these logs exist to explain. An
      # empty outcome means xcodebuild never ran, so there is no log to read.
      - name: Summarize failure
        if: always() && steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        shell: bash
        run: ./scripts/ci/summarize-xcodebuild-failure.sh build-logs/xcodebuild-staging.log

      - name: Upload build logs
        if: always() && steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-staging-logs
          path: build-logs/
          retention-days: 7
          if-no-files-found: warn

  ios-verify-release:
    name: iOS Verify (Release)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Decode production Firebase plist
        env:
          GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" ]; then
            echo "::error::Required secret GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 is missing or empty."
            exit 1
          fi
          mkdir -p AscendApp/App/Firebase
          printf "%s" "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" | base64 --decode > AscendApp/App/Firebase/GoogleService-Info-Production.plist
          plutil -lint AscendApp/App/Firebase/GoogleService-Info-Production.plist

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The production deploy pipeline is the first place the Release
      # configuration would otherwise compile. Building it unsigned here means
      # Release-only build errors surface on the PR, not on launch day. This is
      # also the job that proves the device (iphoneos) compile for PRs.
      - name: Build app (Release, unsigned)
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild \
            -project AscendApp.xcodeproj \
            -scheme "AscendApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-logs/xcodebuild-release.log

      # Its own step, not a tail on the build: the build step's status has to
      # stay the `xcodebuild` pipeline's status, and `Summarize failure` must
      # never be handed the log of a build that actually succeeded.
      #
      # `ProcessInfoPlistFile` runs independently of compilation, so reading the
      # source plist would prove nothing about what ships. This reads the
      # processed bundle plist and requires the boolean - App Store Connect does
      # not reliably accept a string-typed `false`, which is why the type is
      # asserted alongside the value.
      - name: Verify Release bundle export compliance
        shell: bash
        run: |
          set -euo pipefail

          built_info_plist="$(
            xcodebuild \
              -project AscendApp.xcodeproj \
              -scheme "AscendApp" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              -showBuildSettings -json |
              jq -er '
                (map(select(.target == "AscendApp")) | first
                  // error("no AscendApp target in -showBuildSettings output"))
                | .buildSettings
                | (.TARGET_BUILD_DIR // error("TARGET_BUILD_DIR is unset for the AscendApp target"))
                  + "/"
                  + (.INFOPLIST_PATH // error("INFOPLIST_PATH is unset for the AscendApp target"))
              '
          )"

          if [ ! -f "$built_info_plist" ]; then
            echo "::error file=AscendApp/Info.plist::Release build produced no processed Info.plist at ${built_info_plist}."
            exit 1
          fi

          if ! encryption_value="$(plutil -extract ITSAppUsesNonExemptEncryption raw -expect bool -o - "$built_info_plist" 2>&1)"; then
            echo "::error file=AscendApp/Info.plist::Release bundle must declare ITSAppUsesNonExemptEncryption as boolean false, or uploads park in Missing Compliance. Reading ${built_info_plist} failed: ${encryption_value//$'\n'/ }"
            exit 1
          fi

          if [ "$encryption_value" != "false" ]; then
            echo "::error file=AscendApp/Info.plist::Release bundle declares ITSAppUsesNonExemptEncryption=${encryption_value}; it must be boolean false. Built plist: ${built_info_plist}"
            exit 1
          fi

      # A step killed by timeout-minutes reports `cancelled`, not `failure`, and
      # that is exactly the hung-runner case these logs exist to explain. An
      # empty outcome means xcodebuild never ran, so there is no log to read.
      - name: Summarize failure
        if: always() && steps.build.outcome != 'success' && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        shell: bash
        run: ./scripts/ci/summarize-xcodebuild-failure.sh build-logs/xcodebuild-release.log

      - name: Upload build logs
        if: always() && steps.build.outcome != 'success' && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-release-logs
          path: build-logs/
          retention-days: 7
          if-no-files-found: warn
