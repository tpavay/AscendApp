name: CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      # required-check-paths:start
      - "AscendApp/**"
      - "AscendAppTests/**"
      - "AscendLiveActivityWidgets/**"
      - "AscendWatch/**"
      - "AscendWatchShared/**"
      - "AscendApp.xcodeproj/**"
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "remoteconfig.template.json"
      - ".firebaserc"
      - "tests/firebase-rules/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - "fastlane/**"
      - "SharedTestVectors/**"
      - "docs/superwall-paywall-setup.md"
      - "docs/onboarding-design-guide.md"
      - "docs/app-store-brief.md"
      - "docs/launch-readiness-audit.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      # The derived-data-path contract reads the skill files as declared inputs,
      # so an edit to one has to run the suite that guards it.
      - ".claude/skills/**"
      - ".github/workflows/**"
      # required-check-paths:end

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      functions: ${{ steps.filter.outputs.functions }}
      scripts: ${{ steps.filter.outputs.scripts }}
      web: ${{ steps.filter.outputs.web }}
      root_npm: ${{ steps.filter.outputs.root_npm }}
      firebase: ${{ steps.filter.outputs.firebase }}
      ruby: ${{ steps.filter.outputs.ruby }}
      swiftdata_schema: ${{ steps.filter.outputs.swiftdata_schema }}
      remote_config: ${{ steps.filter.outputs.remote_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - "AscendApp/**"
              - "AscendAppTests/**"
              - "AscendLiveActivityWidgets/**"
              # The retained watch target remains a build dependency for the
              # 1.1 release, so a watch-only change is still an iOS change even
              # though the 1.0 phone app does not embed its product.
              - "AscendWatch/**"
              - "AscendWatchShared/**"
              - "AscendApp.xcodeproj/**"
              # The Swift halves of the shared cross-language vectors assert
              # against these files directly, so a vector-only edit must run them.
              - "SharedTestVectors/**"
              - ".github/workflows/**"
            functions:
              - "functions/**"
              - "firestore.indexes.json"
              - "SharedTestVectors/**"
              - ".github/workflows/**"
            scripts:
              - "scripts/**"
              - "SharedTestVectors/**"
              # The Mixpanel build-configuration suite reads every Swift file
              # under AscendApp/ to prove `import Mixpanel` reaches only the
              # telemetry adapter and that session replay is never enabled, and
              # either mistake can be made in any file. So, exactly like the
              # `swiftdata_schema` filter below, this is the whole app tree on
              # purpose and is never narrowed to the folders the telemetry code
              # lives in today. The narrower app paths below stay listed: they
              # are each some suite's declared input, and this entry going away
              # must not silently take them with it.
              - "AscendApp/**"
              # The monetization build-configuration suite reads all three, so a
              # key, Info.plist, or placeholder-contract edit must run it.
              - "AscendApp.xcodeproj/**"
              - "AscendApp/Info.plist"
              # The watch target-configuration suite reads the watch bundle's
              # Info.plist directly, alongside the project file above.
              - "AscendWatch/**"
              - "AscendApp/Features/Monetization/**"
              # The Firebase configuration suite validates all three directly.
              - "firebase.json"
              - ".firebaserc"
              - "firestore.indexes.json"
              # The Remote Config suite asserts the kill-switch template matches
              # RemoteFeatureFlag.swift, so an edit to either must run it.
              - "remoteconfig.template.json"
              - "AscendApp/Shared/Services/RemoteConfig/**"
              # Share card templates are data: the validator reads the renderer's
              # vocabulary out of the Swift sources, so a template edit or a
              # renderer edit must run it. A typo'd stat name would otherwise
              # reach a user as a card with a cell missing.
              - "AscendApp/Features/ShareComposer/**"
              # The launch-offer suite reads the hosted paywall, public copy,
              # legal terms, and authoritative commerce guidance.
              - "web/public/superwall/**"
              - "web/src/pages/index.astro"
              - "web/src/pages/terms.astro"
              - "docs/superwall-paywall-setup.md"
              - "docs/onboarding-design-guide.md"
              - "docs/app-store-brief.md"
              - "docs/launch-readiness-audit.md"
              # AGENTS.md is a symlink to CLAUDE.md, so it gates identically.
              - "CLAUDE.md"
              - "AGENTS.md"
              # The derived-data-path contract reads the skill files as declared
              # inputs, discovering every copyable xcodebuild command they carry,
              # so an edit to one has to run the suite that guards it.
              - ".claude/skills/**"
              # The exported-IPA suite asserts both signed lanes publish their
              # artifact by exact name, so a Fastfile edit must run it: a lane
              # that goes back to picking a wildcard match hands every
              # downstream verification a stale build.
              - "fastlane/**"
              - ".github/workflows/**"
            web:
              - "web/**"
              - ".github/workflows/**"
            root_npm:
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/**"
            firebase:
              - "firestore.rules"
              - "storage.rules"
              - "firestore.indexes.json"
              - "firebase.json"
              - ".firebaserc"
              - "tests/firebase-rules/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/**"
            ruby:
              - "Gemfile"
              - "Gemfile.lock"
              - ".ruby-version"
              - "fastlane/**"
              - ".github/workflows/**"
            remote_config:
              # A kill switch is added in two files that have to agree, and the
              # only check that can see whether one was ever published talks to a
              # live backend - which cannot help on a pull request, where the flag
              # is by definition not published yet. So this gate is the offline
              # half, and it runs whenever either declaration moves.
              - "remoteconfig.template.json"
              - "AscendApp/Shared/Services/RemoteConfig/**"
              - "scripts/lib/remote-config-template.mjs"
              - "scripts/ci/report-kill-switch-changes.mjs"
              - ".github/workflows/**"
            swiftdata_schema:
              # The SwiftData schema check reads every Swift file looking for
              # @Model declarations, and an @Model can be added anywhere. A shipped
              # schema mistake silently defaults every existing row and an iOS
              # binary cannot be rolled back, so this stays the whole app tree and
              # is never narrowed to the folders models happen to live in today.
              - "AscendApp/**"
              # AscendWatchShared/ compiles into the app target too, so an @Model
              # declared there reaches the same store. The check walks both roots.
              - "AscendWatchShared/**"
              - "SharedTestVectors/**"
              - ".github/workflows/**"

  functions-verify:
    name: Functions Verify
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a JVM process, and the pinned firebase-tools
      # refuses to start it on a JDK older than 21.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm --prefix functions ci

      - name: Lint
        run: npm --prefix functions run lint

      - name: Run tests
        run: npm --prefix functions test

      # The unit suite injects a store, so it never exercises the Admin adapter
      # that actually writes the world-readable leaderboard. This runs the
      # production adapter against a real Firestore.
      - name: Run emulator-backed integration tests
        run: npm --prefix functions run test:emulator

      # Audits run last so a newly published advisory fails the job without
      # hiding the lint and test results that prove the code itself.
      - name: Audit dependencies
        run: npm --prefix functions audit --audit-level=low

  scripts-verify:
    name: Scripts Verify
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # The public-identity contract suite spawns dev-db.mjs itself to prove the
      # hydrate-user argument and identity checks run before Firebase is touched,
      # so the scripts package - firebase-admin included - has to be installed.
      - name: Install dependencies
        run: npm --prefix scripts ci

      # sentry-cli is required, not optional: the dSYM upload suite asserts the
      # flags the release script passes against this exact pinned CLI's help.
      # Keep this version identical to the deploy workflows.
      - name: Install Sentry CLI
        run: npm install --global @sentry/cli@3.6.0

      - name: Run tests
        run: node --test scripts/test/*.test.mjs

      # Audits run last so a newly published advisory fails the job without
      # hiding the test results that prove the code itself.
      - name: Audit dependencies
        run: npm --prefix scripts audit --package-lock-only --audit-level=low

  # Its own job, deliberately dependency-free. The check imports nothing but Node
  # builtins and local .mjs files, so it installs nothing and audits nothing: a
  # Swift-only pull request must never be blocked by an advisory against a
  # scripts-only Node dependency, or the gate that guards a user's data becomes
  # the thing people learn to route around.
  swiftdata-schema-verify:
    name: SwiftData Schema Verify
    needs: changes
    if: needs.changes.outputs.swiftdata_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the persisted SwiftData shape
        run: node scripts/check-swiftdata-schema.mjs

  # Dependency-free for the same reason as the SwiftData gate above: it imports
  # nothing but Node builtins and local .mjs files, so a pull request that adds a
  # kill switch is never blocked by an advisory against an unrelated dependency.
  remote-config-verify:
    name: Remote Config Verify
    needs: changes
    if: needs.changes.outputs.remote_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The base commit has to be present for the added/removed comparison; the
      # check still asserts app-to-template parity without it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Report what this change does to the kill switches
        run: node scripts/ci/report-kill-switch-changes.mjs --base-ref "${{ github.event.pull_request.base.sha }}"

  web-verify:
    name: Web Verify
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Build website
        run: npm --prefix web run build

      - name: Audit dependencies
        run: npm --prefix web audit --audit-level=low

  root-npm-verify:
    name: Root npm Audit
    needs: changes
    if: needs.changes.outputs.root_npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low

  firebase-verify:
    name: Firebase Verify
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The Firestore and Storage emulators are JVM processes, and the pinned
      # firebase-tools refuses to start them on a JDK older than 21. The runner
      # image's default JDK is older than that, so pin one the CLI accepts.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Firebase configuration
        run: node scripts/ci/validate-firebase-config.mjs

      # The emulators load firestore.rules and storage.rules before executing
      # the suite, so invalid syntax fails the job before any unit test runs.
      #
      # The npm script pins `--test-concurrency=1` and must keep it. Firestore
      # rulesets are per project, but the Storage emulator holds exactly one
      # global ruleset: every `initializeTestEnvironment({storage})` tears the
      # loaded ruleset down and rebuilds it, and while that is in flight the
      # emulator denies every Storage request - including the admin `owner`
      # token `clearStorage()` uses. Two rules files that both configure Storage
      # therefore knock each other out when node runs test files in parallel.
      - name: Validate rules and run emulator tests
        run: npm run test:firebase-rules

  # Verifies the bundle under the Ruby the deploy workflows pin, not the local
  # .ruby-version, so the gate resolves the Gemfile the way releases do.
  ruby-verify:
    name: Ruby and Fastlane Verify
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies in deployment mode
        run: bundle install --deployment --jobs 4 --retry 3

      - name: Validate Fastlane lanes
        run: bundle exec fastlane lanes

# required-check-contexts:start
  ios-verify:
    name: iOS Verify (Staging)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p AscendApp/App/Firebase
          rm -f AscendApp/App/Firebase/GoogleService-Info-Dev.plist
          rm -f AscendApp/App/Firebase/GoogleService-Info-Staging.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "AscendApp/App/Firebase/GoogleService-Info-Staging.plist"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The runner image decides which simulator runtimes and devices it ships,
      # and that set changes without notice - treating it as the source of truth
      # makes every PR fail the day it changes. Provision the device this job
      # needs instead, falling back through: reuse a preferred model, reuse any
      # iPhone, then create one.
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          preferred_names=(
            "iPhone 17 Pro"
            "iPhone 17"
            "iPhone 16 Pro"
            "iPhone 16"
            "iPhone 15 Pro"
            "iPhone 15"
          )

          newest_ios_runtime() {
            xcrun simctl list runtimes -j | jq -r '
              [.runtimes[]
                | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))]
              | sort_by(.version | split(".") | map(tonumber))
              | last | .identifier // empty
            '
          }

          runtime="$(newest_ios_runtime)"

          # Xcode bundles the simulator SDK but not the runtime, so an image can
          # compile for the simulator while offering nothing to run tests on.
          # A failed download still falls through to the diagnostics below.
          if [ -z "$runtime" ]; then
            echo "No iOS simulator runtime installed; downloading the one Xcode expects."
            xcodebuild -downloadPlatform iOS || echo "::warning::Downloading the iOS simulator runtime failed."
            runtime="$(newest_ios_runtime)"
          fi

          if [ -z "$runtime" ]; then
            echo "::error::No iOS simulator runtime is available."
            xcrun simctl list runtimes
            exit 1
          fi

          device_named() {
            xcrun simctl list devices -j | jq -r --arg rt "$runtime" --arg name "$1" '
              .devices[$rt] // []
              | map(select(.isAvailable and .name == $name))
              | last | .udid // empty
            '
          }

          simulator_id=""

          for name in "${preferred_names[@]}"; do
            simulator_id="$(device_named "$name")"

            if [ -n "$simulator_id" ]; then
              break
            fi
          done

          if [ -z "$simulator_id" ]; then
            simulator_id="$(
              xcrun simctl list devices -j | jq -r --arg rt "$runtime" '
                .devices[$rt] // []
                | map(select(.isAvailable and ((.deviceTypeIdentifier // "") | test("SimDeviceType.iPhone"))))
                | last | .udid // empty
              '
            )"
          fi

          if [ -z "$simulator_id" ]; then
            device_type=""

            for name in "${preferred_names[@]}"; do
              device_type="$(
                xcrun simctl list runtimes -j | jq -r --arg rt "$runtime" --arg name "$name" '
                  .runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes
                  | map(select(.name == $name))
                  | last | .identifier // empty
                '
              )"

              if [ -n "$device_type" ]; then
                break
              fi
            done

            if [ -z "$device_type" ]; then
              device_type="$(
                xcrun simctl list runtimes -j | jq -r --arg rt "$runtime" '
                  .runtimes[] | select(.identifier == $rt) | .supportedDeviceTypes
                  | map(select(.productFamily == "iPhone"))
                  | last | .identifier // empty
                '
              )"
            fi

            if [ -z "$device_type" ]; then
              echo "::error::Runtime ${runtime} supports no iPhone device type."
              xcrun simctl list devicetypes
              exit 1
            fi

            echo "No iPhone simulator on ${runtime}; creating one from ${device_type}."
            simulator_id="$(xcrun simctl create "ci-iphone" "$device_type" "$runtime")"
          fi

          echo "Selected simulator ${simulator_id} on ${runtime}."
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

          # Start the boot now and let it run under the compile: the runner's
          # first boot of this device took 3.9 minutes of silence inside the
          # first xcodebuild that needed it (job 100376172708), and nothing
          # in the build needs the device. `simctl boot` returns once the boot
          # is under way; the test script waits on `bootstatus -b` before its
          # first pass, which boots again if this attempt failed. Output goes
          # nowhere so a boot still in progress cannot hold this step open.
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 &
          echo "Booting ${simulator_id} in the background."

      - name: Provision watchOS runtime (best effort)
        shell: bash
        run: ./scripts/ci/ensure-watchos-runtime.sh

      # Only this job's own configuration: each `-showBuildSettings` resolves
      # the whole package graph (~55 s on the runner), and the pairwise
      # distinctness of all three destinations is proved from project.pbxproj
      # by the scripts job.
      - name: Verify Mixpanel build destinations
        run: node scripts/ci/assert-mixpanel-build-settings.mjs Staging

      # The device (iphoneos) compile is covered by the ios-verify-release job;
      # this job proves the simulator build + test suite, so the app compiles
      # exactly once per job instead of twice.
      #
      # The suite runs across several host processes rather than one, because
      # the host's memory grows with the tests it has executed and one process
      # exhausts the runner before reaching the end. The script owns that
      # reasoning and the measurements behind it.
      #
      # The step's own timeout sits below the job's on purpose. A job killed
      # by the job-level cap concludes `cancelled`; a step killed by its own
      # cap fails, and the job concludes `failure` - which is what a hung
      # runner is. The script's silence watchdog normally fires long before
      # either (five minutes without output); this is the backstop.
      - name: Run tests
        id: tests
        shell: bash
        timeout-minutes: 38
        run: ./scripts/ci/run-ios-test-passes.sh "${{ steps.simulator.outputs.id }}"

      # A step killed by the job-level timeout-minutes reports `cancelled`,
      # not `failure`, and that is exactly the hung-runner case these logs
      # exist to explain. An empty outcome means xcodebuild never ran, so there
      # is no log to read.
      - name: Summarize failure
        if: always() && steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        shell: bash
        run: ./scripts/ci/summarize-xcodebuild-failure.sh build-logs/xcodebuild-staging.log

      - name: Upload build logs
        if: always() && steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-staging-logs
          path: build-logs/
          retention-days: 7
          if-no-files-found: warn

  ios-verify-release:
    name: iOS Verify (Release)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Decode production Firebase plist
        env:
          GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" ]; then
            echo "::error::Required secret GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 is missing or empty."
            exit 1
          fi
          mkdir -p AscendApp/App/Firebase
          printf "%s" "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" | base64 --decode > AscendApp/App/Firebase/GoogleService-Info-Production.plist
          plutil -lint AscendApp/App/Firebase/GoogleService-Info-Production.plist

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Provision watchOS runtime (best effort)
        shell: bash
        run: ./scripts/ci/ensure-watchos-runtime.sh

      # Only this job's own configuration, for the reason given on the
      # Staging job; the processed bundle is proved separately below.
      - name: Verify Mixpanel build destinations
        run: node scripts/ci/assert-mixpanel-build-settings.mjs Release

      # The production deploy pipeline is the first place the Release
      # configuration would otherwise compile. Building it unsigned here means
      # Release-only build errors surface on the PR, not on launch day. This is
      # also the job that proves the device (iphoneos) compile for PRs.
      #
      # Its own timeout, below the job's, so a hung compile fails the step and
      # the job concludes `failure` rather than `cancelled`. The build takes
      # 9-14 minutes.
      - name: Build app (Release, unsigned)
        id: build
        shell: bash
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild \
            -project AscendApp.xcodeproj \
            -scheme "AscendApp" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-logs/xcodebuild-release.log

      # `-showBuildSettings` re-evaluates the whole project graph, so the three
      # checks below resolve what they read from the build product once, here.
      - name: Resolve the Release build product paths
        id: product
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project AscendApp.xcodeproj \
            -scheme "AscendApp" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings -json |
            jq -er '
              (map(select(.target == "AscendApp")) | first
                // error("no AscendApp target in -showBuildSettings output"))
              | .buildSettings
              | (.TARGET_BUILD_DIR // error("TARGET_BUILD_DIR is unset for the AscendApp target")) as $dir
              | "app-bundle=" + $dir + "/"
                  + (.WRAPPER_NAME // error("WRAPPER_NAME is unset for the AscendApp target")),
                "info-plist=" + $dir + "/"
                  + (.INFOPLIST_PATH // error("INFOPLIST_PATH is unset for the AscendApp target"))
            ' | tee -a "$GITHUB_OUTPUT"

      # Its own step, not a tail on the build: the build step's status has to
      # stay the `xcodebuild` pipeline's status, and `Summarize failure` must
      # never be handed the log of a build that actually succeeded.
      #
      # `ProcessInfoPlistFile` runs independently of compilation, so reading the
      # source plist would prove nothing about what ships. This reads the
      # processed bundle plist and requires the boolean - App Store Connect does
      # not reliably accept a string-typed `false`, which is why the type is
      # asserted alongside the value.
      #
      # The 1.0 product has one shipped application bundle. The retained watch
      # target is built for 1.1 but is not embedded in this phone app.
      - name: Verify Release bundle export compliance
        shell: bash
        env:
          APP_BUNDLE: ${{ steps.product.outputs.app-bundle }}
        run: |
          set -euo pipefail

          assert_export_compliance() {
            local built_info_plist="$1"
            local source_file="$2"
            local encryption_value

            if [ ! -f "$built_info_plist" ]; then
              echo "::error file=${source_file}::Release build produced no processed Info.plist at ${built_info_plist}."
              exit 1
            fi

            if ! encryption_value="$(plutil -extract ITSAppUsesNonExemptEncryption raw -expect bool -o - "$built_info_plist" 2>&1)"; then
              echo "::error file=${source_file}::Release bundle must declare ITSAppUsesNonExemptEncryption as boolean false, or uploads park in Missing Compliance. Reading ${built_info_plist} failed: ${encryption_value//$'\n'/ }"
              exit 1
            fi

            if [ "$encryption_value" != "false" ]; then
              echo "::error file=${source_file}::Release bundle declares ITSAppUsesNonExemptEncryption=${encryption_value}; it must be boolean false. Built plist: ${built_info_plist}"
              exit 1
            fi

            echo "Verified ${built_info_plist} declares ITSAppUsesNonExemptEncryption=false."
          }

          assert_export_compliance "${APP_BUNDLE}/Info.plist" "AscendApp/Info.plist"

      # An empty app icon set builds clean and is caught only by Apple's
      # server-side upload validation, a full deploy cycle later. The script
      # documents the rejection it prevents.
      - name: Verify the phone bundle ships an app icon
        shell: bash
        env:
          APP_BUNDLE: ${{ steps.product.outputs.app-bundle }}
        run: |
          set -euo pipefail

          node scripts/ci/assert-app-icon-present.mjs "$APP_BUNDLE" phone

      - name: Verify Release Mixpanel destination in the processed bundle
        shell: bash
        env:
          BUILT_INFO_PLIST: ${{ steps.product.outputs.info-plist }}
        run: |
          set -euo pipefail

          node scripts/ci/assert-mixpanel-bundle.mjs Release "$BUILT_INFO_PLIST"

      # A step killed by the job-level timeout-minutes reports `cancelled`,
      # not `failure`, and that is exactly the hung-runner case these logs
      # exist to explain. An empty outcome means xcodebuild never ran, so there
      # is no log to read.
      - name: Summarize failure
        if: always() && steps.build.outcome != 'success' && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        shell: bash
        run: ./scripts/ci/summarize-xcodebuild-failure.sh build-logs/xcodebuild-release.log

      - name: Upload build logs
        if: always() && steps.build.outcome != 'success' && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-release-logs
          path: build-logs/
          retention-days: 7
          if-no-files-found: warn
# required-check-contexts:end
